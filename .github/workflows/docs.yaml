name: Docs

on:
    push:
        branches: [main]
    release:
        types: [released]
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    docs:
        runs-on: ubuntu-22.04
        steps:
        - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

        - name: Setup Python
          uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
          with:
              python-version: "3.10"

        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install .[doc]

        - name: Build HTML artifact
          run: python build_docs.py

        - name: Upload HTML artifact
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
          with:
              name: DocumentationHTML
              path: docs/_build/ape

        - name: Commit and publish documentation changes to gh-pages branch
          run: |
              if [[ "${GITHUB_EVENT_NAME}" =~ "pull_request" ]]; then
                echo "skipping 'git commit' step for PR"
              else
                git clone https://github.com/${GITHUB_REPOSITORY} --branch gh-pages --single-branch gh-pages
                cp -r docs/_build/ape/* gh-pages/
                cd gh-pages
                touch .nojekyll
                git config --local user.email "action@github.com"
                git config --local user.name "GitHub Action"
                git add .
                git commit -m "Update documentation" -a || true
              fi
        - name: Push changes
          uses: ad-m/github-push-action@master
          if: ${{ github.event_name != 'pull_request' }}
          with:
              branch: gh-pages
              directory: gh-pages
              github_token: ${{ secrets.GITHUB_TOKEN }}

# Superseded PR validation must not hold runner capacity.
concurrency:
  group: pr-ci-docs.yaml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
